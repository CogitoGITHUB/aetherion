[package]
authors.workspace = true
description = "Color configuration code used by Nushell"
repository = "https://github.com/nushell/aiu-shell/tree/main/crates/aiu-shell-color-config"
edition.workspace = true
license.workspace = true
name = "aiu-shell-color-config"
rust-version.workspace = true
version.workspace = true

[lib]
bench = false
harness = false

[[test]]
name = "tests"
path = "tests/main.rs"
harness = false

[lints]
workspace = true

[dependencies]
aiu-shell-protocol.workspace = true
aiu-shell-engine.workspace = true
aiu-shell-json.workspace = true
nu-ansi-term.workspace = true

serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
aiu-shell-test-support = { path = "../aiu-shell-test-support", features = ["os"] }
