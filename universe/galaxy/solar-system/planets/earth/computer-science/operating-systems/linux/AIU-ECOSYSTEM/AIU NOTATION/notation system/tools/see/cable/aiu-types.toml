[metadata]
name = "aiu-types"
description = "Pick a file type"

[source]
command = "bash aiu-types.sh"
display = "{}"
output = "{}"

[preview]
cached = false
command = 'bash aiu-type-preview-fit.sh "{}"'

[keybindings]
enter = "actions:pick"

[actions.pick]
description = "write the chosen type to /tmp/aiu-type"
command = "printf %s {} > /tmp/aiu-type"
shell = "bash"
mode = "execute"
