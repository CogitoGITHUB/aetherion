[package]
authors.workspace = true
description = "Shared internal functionality to support Nushell plugins"
repository = "https://github.com/nushell/aiu-shell/tree/main/crates/aiu-shell-plugin-core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
name = "aiu-shell-plugin-core"
version.workspace = true

[lib]
bench = false

[lints]
workspace = true

[dependencies]
aiu-shell-plugin-protocol.workspace = true
aiu-shell-protocol.workspace = true
aiu-shell-utils.workspace = true

rmp-serde = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
interprocess = { workspace = true, optional = true }

[features]
default = ["local-socket"]
local-socket = ["interprocess", "aiu-shell-plugin-protocol/local-socket"]

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }
