[metadata]
name = "zoxide"
description = "Browse zoxide directory history"
requirements = ["zoxide"]

[source]
command = "zoxide query -l"
no_sort = true
frecency = false
display = "{split:/:-1}"

[preview]
command = "ls --short-names -la \"{}\" | table | ansi strip"

[keybindings]
ctrl-d = "actions:remove"

[actions.cd]
description = "Change to the selected directory"
command = "cd {} && $SHELL"
mode = "execute"

[actions.remove]
description = "Remove the selected directory from zoxide"
command = "zoxide remove {}"
mode = "fork"

[ui.preview_panel]
size = 80
