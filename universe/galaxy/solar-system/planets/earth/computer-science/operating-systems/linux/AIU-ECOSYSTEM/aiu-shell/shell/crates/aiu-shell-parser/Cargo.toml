[package]
authors.workspace = true
description = "Nushell's parser"
repository = "https://github.com/nushell/aiu-shell/tree/main/crates/aiu-shell-parser"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
name = "aiu-shell-parser"
version.workspace = true
exclude = ["/fuzz"]

[lib]
bench = false

[lints]
workspace = true

[dependencies]
aiu-shell-engine.workspace = true
aiu-shell-path.workspace = true
aiu-shell-plugin-engine = { workspace = true, optional = true }
aiu-shell-protocol.workspace = true
aiu-shell-utils.workspace = true
aiu-shell-experimental.workspace = true

chrono = { default-features = false, features = ['std'], workspace = true }
itertools = { workspace = true }
log = { workspace = true }
memchr = { workspace = true }
rustc-hash = { workspace = true }
semver = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rstest = { workspace = true, default-features = false }

[features]
plugin = ["aiu-shell-plugin-engine", "aiu-shell-engine/plugin"]
