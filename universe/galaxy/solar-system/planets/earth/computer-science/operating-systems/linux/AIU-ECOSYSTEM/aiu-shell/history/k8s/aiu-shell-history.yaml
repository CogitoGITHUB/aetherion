---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiu-shell-history
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: aiu-shell-history
  template:
    metadata:
      labels:
        io.kompose.service: aiu-shell-history
    spec:
      containers:
        - args:
            - start
          env:
            - name: AIU_SHELL_HISTORY_DB_URI
              valueFrom:
                secretKeyRef:
                  name: aiu-shell-history-secrets
                  key: AIU_SHELL_HISTORY_DB_URI
                  optional: false
            - name: AIU_SHELL_HISTORY_HOST
              value: 0.0.0.0
            - name: AIU_SHELL_HISTORY_PORT
              value: "8888"
            - name: AIU_SHELL_HISTORY_OPEN_REGISTRATION
              value: "true"
          image: ghcr.io/atuinsh/atuin:latest
          name: aiu-shell-history
          ports:
            - containerPort: &port 8888
          resources:
            limits:
              cpu: 250m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: *port
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: *port
            initialDelaySeconds: 3
            periodSeconds: 3
          readinessProbe:
            tcpSocket:
              port: *port
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - mountPath: /config
              name: aiu-shell-history-claim0
        - name: postgresql
          image: postgres:14
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: aiu-shell-history
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aiu-shell-history-secrets
                  key: AIU_SHELL_HISTORY_DB_PASSWORD
                  optional: false
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: aiu-shell-history-secrets
                  key: AIU_SHELL_HISTORY_DB_USERNAME
                  optional: false
          resources:
            limits:
              cpu: 250m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 1Gi
          volumeMounts:
            - mountPath: /var/lib/postgresql/data/
              name: database
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: database
        - name: aiu-shell-history-claim0
          persistentVolumeClaim:
            claimName: aiu-shell-history-claim0
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: aiu-shell-history
  name: aiu-shell-history
spec:
  type: NodePort
  ports:
    - name: "8888"
      port: 8888
      nodePort: 31929
  selector:
    io.kompose.service: aiu-shell-history
---
kind: PersistentVolume
apiVersion: v1
metadata:
  name: database-pv
  labels:
    app: database
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 300Mi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/Users/firstname.lastname/.kube/database"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    io.kompose.service: database
  name: database
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 300Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    io.kompose.service: aiu-shell-history-claim0
  name: aiu-shell-history-claim0
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Mi
