[package]
authors = ["The Nushell Project Developers"]
description = "Debug Adapter Protocol server for Nushell scripts"
repository = "https://github.com/nushell/aiu-shell/tree/main/crates/aiu-shell-dap"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
name = "aiu-shell-dap"
version.workspace = true
autotests = false

[lib]
name = "aiu_shell_dap"
harness = false

[[test]]
name = "dap"
path = "tests/dap.rs"
harness = false

[lints]
workspace = true

[dependencies]
aiu-shell-protocol = { workspace = true, features = ["os"] }
aiu-shell-parser = { workspace = true }
aiu-shell-engine = { workspace = true, features = ["os"] }
aiu-shell-path = { workspace = true }
aiu-shell-utils = { workspace = true }

derive_more = { workspace = true, features = ["debug"] }
miette = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# Only the unit tests build a command context to render values against; the
# adapter itself is handed the host's fully built engine.
aiu-shell-cmd-lang = { workspace = true, features = ["os"] }
aiu-shell-command = { workspace = true, features = ["os"] }
aiu-shell-test-support = { path = "../aiu-shell-test-support" }

rstest = { workspace = true, default-features = false }
pretty_assertions = { workspace = true }
# Only for the rendering matrix in `src/variables.rs`: constructing a
# `Value::Date` needs a `chrono` type, and a `Value::Custom` case needs a local
# `CustomValue` stub, whose trait carries `#[typetag::serde]`.
chrono = { workspace = true, features = ["std"] }
typetag = "0.2"
