[lib]
bench = false

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
aiu-shell-experimental = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
doc-comment = "0.3"

[lints]
workspace = true
