repository = "https://github.com/nushell/aiu-shell/tree/main/crates/aiu-shell-test-support-macros"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
name = "aiu-shell-test-support-macros"
version.workspace = true

[lib]
