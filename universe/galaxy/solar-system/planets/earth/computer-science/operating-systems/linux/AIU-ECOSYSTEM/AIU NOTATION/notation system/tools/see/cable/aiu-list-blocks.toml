[metadata]
name = "aiu-list-blocks"
description = "Blocks the parser knows"

[source]
command = "bash aiu-list.sh blocks"
display = "{}"
output = "{}"

[preview]
command = "bash aiu-list-preview-fit.sh block \"{}\""

[keybindings]
enter = "actions:pick"

[actions.pick]
description = "write the chosen block to /tmp/aiu-list"
command = "printf %s {} > /tmp/aiu-list"
shell = "bash"
mode = "execute"
