aiu-shell-history-server-sqlite = { workspace = true }

tracing = { workspace = true }
time = { workspace = true }
eyre = { workspace = true }
config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true }
axum = "0.8"
fs-err = { workspace = true }
tower = { workspace = true }
