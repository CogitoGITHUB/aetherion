# One job: the crate manifest — the hot path builds from here.
# The build writes its target directory outside the tree, so nothing is
# written here but the source: see the build command in the project README.

[package]
name = "aiu-editor"
version = "0.1.0"
edition = "2021"

# The hot path is the one binary: the Rust side of the seam. It reads a
# request file and writes an answer file; the meaning side asks it over
# the file wire.
[[bin]]
name = "hot-path"
path = "src/join/hot-path.rs"

[dependencies]
# The shared read-only Git layer, by path: one Git model for this program
# and for the multiplexer, so the two cannot disagree about what Git says.
git-inspection = { path = "../../../shared-layers/git-inspection" }

# The AIU NOTATION engine, by path: the parser the editor hosts. It has no
# dependencies of its own and is never fetched, so the build stays offline;
# the editor calls it in-process, so opening a page needs no second program.
notation = { path = "../../../AIU NOTATION/notation system/notation" }
