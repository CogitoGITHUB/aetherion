[package]
authors.workspace = true
description = "Path handling library for Nushell"
repository = "https://github.com/nushell/aiu-shell/tree/main/crates/aiu-shell-path"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
name = "aiu-shell-path"
version.workspace = true
exclude = ["/fuzz"]

[lib]
bench = false

[dependencies]
dirs = { workspace = true }
ref-cast = "1.0.25"

[target.'cfg(windows)'.dependencies]
omnipath = { workspace = true }

[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "android")))'.dependencies]
pwd = { workspace = true }

[lints]
workspace = true
