[package]
authors.workspace = true
description = "CLI-related functionality for Nushell"
repository = "https://github.com/nushell/aiu-shell/tree/main/crates/aiu-shell-cli"
edition.workspace = true
license.workspace = true
name = "aiu-shell-cli"
rust-version.workspace = true
version.workspace = true
autotests = false

[lib]
bench = false
harness = false

[[test]]
name = "tests"
path = "tests/main.rs"
harness = false

[dev-dependencies]
aiu-shell-cmd-lang = { workspace = true, features = ["os"] }
aiu-shell-command = { workspace = true, features = ["os"] }
aiu-shell-std.workspace = true
aiu-shell-test-support = { path = "../aiu-shell-test-support", features = ["os"] }
rstest = { workspace = true, default-features = false }
tempfile = { workspace = true }

[dependencies]
aiu-shell-cmd-base.workspace = true
aiu-shell-command = { workspace = true, features = ["os"] }
aiu-shell-engine = { workspace = true, features = ["os"] }
aiu-shell-glob.workspace = true
aiu-shell-path.workspace = true
aiu-shell-parser.workspace = true
aiu-shell-plugin-engine = { workspace = true, optional = true }
aiu-shell-protocol = { workspace = true, features = ["os"] }
aiu-shell-config.workspace = true
aiu-shell-utils.workspace = true
aiu-shell-color-config.workspace = true
aiu-shell-experimental.workspace = true
nu-ansi-term.workspace = true
aiu-shell-jump = { path = "../../../jump" }
reedline = { workspace = true, features = ["bashisms"] }

chrono = { default-features = false, features = ["std"], workspace = true }
crossterm = { workspace = true }
fancy-regex = { workspace = true }
is_executable = { workspace = true }
log = { workspace = true }
lru = { workspace = true }
lscolors = { workspace = true, default-features = false, features = ["nu-ansi-term"] }
miette = { workspace = true, features = ["fancy-no-backtrace"] }
nucleo-matcher = { workspace = true }
parking_lot = { workspace = true }
percent-encoding = { workspace = true }
sysinfo = { workspace = true }
strum = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
which = { workspace = true }

[features]
plugin = ["aiu-shell-plugin-engine"]
system-clipboard = ["reedline/system_clipboard"]
sqlite = ["reedline/sqlite", "aiu-shell-protocol/sqlite", "aiu-shell-command/sqlite"]

[lints]
workspace = true
