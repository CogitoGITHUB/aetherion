[metadata]
name = "aiu-list-kind"
description = "Blocks or file types"

[source]
command = "cat aiu-list-kind.txt"
display = "{split:;:0}"
output = "{split:;:0}"

[preview]
command = "bash aiu-list-preview.sh kind \"{}\""

[keybindings]
enter = "actions:pick"

[actions.pick]
description = "write the chosen kind to /tmp/aiu-list-kind"
command = "printf %s {} > /tmp/aiu-list-kind"
shell = "bash"
mode = "execute"
