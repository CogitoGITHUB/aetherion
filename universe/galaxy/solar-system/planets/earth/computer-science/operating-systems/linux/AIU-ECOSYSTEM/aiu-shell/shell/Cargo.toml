aiu-shell-test-support = { path = "./crates/aiu-shell-test-support", features = ["os", "plugin"] }

assert_cmd = "2.2.2"
dirs = { workspace = true }
fancy-regex = { workspace = true }
itertools = { workspace = true }
pretty_assertions = { workspace = true }
rstest = { workspace = true, default-features = false }
tango-bench = "0.9.0"
tempfile = { workspace = true }

[features]
# Enable all features while still avoiding mutually exclusive features.
# Use this if `--all-features` fails.
full = [
  "dap",
  "lsp",
  "mcp",
  "network",
  "plugin",
  "rustls-tls",
  "sqlite",
  "system-clipboard",
  "trash-support",
]

plugin = [
  # crates
  "dep:aiu-shell-cmd-plugin",
  "dep:aiu-shell-plugin-engine",

  # features
  "aiu-shell-cli/plugin",
  "aiu-shell-cmd-lang/plugin",
  "aiu-shell-command/plugin",
  "aiu-shell-config/plugin",
  "aiu-shell-engine/plugin",
  "aiu-shell-parser/plugin",
  "aiu-shell-protocol/plugin",
]

dap = ["dep:aiu-shell-dap"]

lsp = ["dep:aiu-shell-lsp"]

mcp = [
  "dep:aiu-shell-mcp",
  "aiu-shell-mcp/mcp",
]

network = ["aiu-shell-command/network"]
native-tls = ["aiu-shell-command/native-tls"]
rustls-tls = ["aiu-shell-command/rustls-tls"]

default = [
  "dap",
  "lsp",
  "mcp",
  "network",
  "plugin",
  "rustls-tls",
  "sqlite",
  "trash-support",
]
stable = ["default"]
# NOTE: individual features are also passed to `aiu-shell-cmd-lang` that uses them to generate the feature matrix in the `version` command

# Enable to statically link OpenSSL (perl is required, to build OpenSSL https://docs.rs/openssl/latest/openssl/);
# otherwise the system version will be used. Not enabled by default because it takes a while to build
static-link-openssl = ["dep:openssl"]

# Optional system clipboard support in `reedline`, this behavior has problematic compatibility with some systems.
# Missing X server/ Wayland can cause issues
system-clipboard = [
  "reedline/system_clipboard",
  "aiu-shell-cli/system-clipboard",
]

# Stable (Default)
trash-support = ["aiu-shell-command/trash-support"]

# SQLite commands for aiu-shell
sqlite = [
  "aiu-shell-cli/sqlite",
  "aiu-shell-command/sqlite",
  "aiu-shell-std/sqlite",
  "aiu-shell-protocol/sqlite",
  "reedline/sqlite",
]

[profile.release]
opt-level = "s"     # Optimize for size
strip = "debuginfo"
lto = "thin"

# build with `cargo build --profile profiling`
# to analyze performance with tooling like linux perf
[profile.profiling]
inherits = "release"
strip = false
debug = true

# build with `cargo build --profile ci`
# to analyze performance with tooling like linux perf
[profile.ci]
inherits = "dev"
strip = false
debug = false

# Main nu binary
[[bin]]
name = "aiu-shell"
path = "src/main.rs"
bench = false

# To use a development version of a dependency please use a global override here
# changing versions in each sub-crate of the workspace is tedious
[patch.crates-io]
reedline = { path = "../reedline" }
# nu-ansi-term = { git = "https://github.com/nushell/nu-ansi-term.git", branch = "main" }

# Run all benchmarks with `cargo bench`
# Run individual benchmarks like `cargo bench -- <regex>` e.g. `cargo bench -- parse`
[[bench]]
name = "benchmarks"
harness = false
