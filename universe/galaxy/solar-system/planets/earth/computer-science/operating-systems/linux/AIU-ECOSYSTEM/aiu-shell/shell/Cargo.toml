[workspace.lints.rust]
# This denies all rustc warnings (including the ones that were causing noise)
# equivalent to -D warnings
warnings = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ci)"] }
linker_messages = "allow" # silence '__eh_frame section too large (max 16MB)' on macos

[workspace.lints.clippy]
# Warning: workspace lints affect library code as well as tests, so don't enable lints that would be too noisy in tests like that.
# todo = "warn"
format_push_string = "warn"
needless_raw_strings = "warn"
result_large_err = "allow"
unchecked_time_subtraction = "deny"
unwrap_used = "deny"
used_underscore_binding = "warn"
# need to allow this temporarily because it may change code logic.
# let's keep it until we update rustc version to 1.96
# which resolve the issue: https://github.com/rust-lang/rust-clippy/issues/16875
collapsible_match = "allow"
# `.filter_map(|x| x)` has different performance characteristics than
# `.flatten()` and `.flat_map(|x| x)`
filter_map_identity = "allow"

[lints]
workspace = true

