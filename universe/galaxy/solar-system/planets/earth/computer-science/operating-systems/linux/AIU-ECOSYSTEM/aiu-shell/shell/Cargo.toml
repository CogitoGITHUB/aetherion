[build-dependencies]
winresource = "0.1.31"

[target.'cfg(target_family = "unix")'.dependencies]
nix = { workspace = true, default-features = false, features = [
  "signal",
  "process",
  "fs",
  "term",
] }

[target.'cfg(target_os = "windows")'.dependencies]
# `GetCommandLineW` lets us recover the raw, still-quoted command line for the
# `/c` ComSpec alias.
windows-sys = { workspace = true, features = ["Win32_System_Environment"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
aiu-shell-plugin-core = { path = "./crates/aiu-shell-plugin-core", version = "0.116.2" }
aiu-shell-plugin-protocol = { path = "./crates/aiu-shell-plugin-protocol", version = "0.116.2" }
